<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="U.N.D Industries Alternative Dashboard View - account management and client portal access.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <meta name="theme-color" content="#0d0d0f">

  <title>Studio Panel &mdash; U.N.D Industries</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=ba7e99b6e6">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48 256x256">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    .studio-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .studio-card {
      max-width: 520px; width: 100%;
      background: var(--bg-card, #15151a);
      border: 1px solid var(--border-accent, rgba(124,92,255,.35));
      border-radius: var(--radius-lg, 20px);
      padding: 44px 34px; text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    .studio-icon { font-size: 2.6rem; margin-bottom: 10px; }
    .studio-badge {
      display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent-light, #a78bfa); background: rgba(124,92,255,.14);
      border: 1px solid rgba(124,92,255,.35); border-radius: 999px; padding: 5px 14px; margin-bottom: 16px;
    }
    .studio-card h1 { font-size: 1.9rem; margin: 0 0 10px; }
    .studio-card p { color: var(--text-muted, #64748b); line-height: 1.6; margin: 0 0 26px; }
  </style>
</head>
<body data-page="studio">
  <div class="studio-wrap">
    <div class="studio-card">
      <div class="studio-icon">&#128295;</div>
      <div class="studio-badge">Internal Tool</div>
      <h1>Studio Panel</h1>
      <p>This internal studio workspace is part of the U.N.D Industries workflow and is still
         under construction. There's nothing to see here yet &mdash; check back soon.</p>
      <a href="dashboard.html" class="btn btn-outline">&larr; Back to Dashboard</a>
    </div>
  </div>
</body>
